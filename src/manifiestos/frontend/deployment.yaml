apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: pdf-converter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: perlavalerio/pdf-converter-frontend:latest  
        imagePullPolicy: Always
        ports:
        - containerPort: 80
